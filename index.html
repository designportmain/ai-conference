<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#dfe9f3;overflow:hidden;overscroll-behavior:none}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .app{position:relative;height:100%;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 24px rgba(11,57,133,.15)}
  /* 가로 넘김 영역 */
  .slider{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .slider::-webkit-scrollbar{display:none}
  .page{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
  .page::-webkit-scrollbar{display:none}
  .inner{min-height:100%;display:flex;align-items:center}
  .art{position:relative;width:100%;line-height:0}
  .art img{width:100%;height:auto;display:block;-webkit-user-drag:none;user-select:none}
  .p1{background:linear-gradient(#fff 50%,#093785 50%)}
  .p2,.p3{background:#fff}
  .p4{background:linear-gradient(#0f3c7d 50%,#c5e8fc 50%)}
  .anchor{position:absolute;left:0;width:1px;height:1px}
  .hot{position:absolute;display:block;border-radius:12px;-webkit-tap-highlight-color:transparent}
  .hot:active{background:rgba(0,120,215,.18)}
  @media(hover:hover){.hot:hover{background:rgba(0,120,215,.10);outline:2px solid rgba(0,120,215,.35)}}
  /* 페이지 표시 점 */
  .dots{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 10px);display:flex;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.8);box-shadow:0 1px 4px rgba(11,57,133,.2);pointer-events:none;z-index:5}
  .dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(11,57,133,.35);transition:.25s}
  .dots i.on{width:22px;background:#0090da}
  /* PC용 좌우 화살표 */
  .arrow{position:absolute;top:calc(50% - var(--navh)/2);transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(11,57,133,.55);color:#fff;font-size:20px;cursor:pointer;z-index:6;display:none}
  .arrow.prev{left:8px} .arrow.next{right:8px}
  @media(hover:hover) and (pointer:fine){.arrow{display:block}.arrow[disabled]{opacity:0;pointer-events:none}}
  /* 처음 한 번 넘김 안내 */
  .hint{position:absolute;right:12px;top:calc(50% - var(--navh)/2);transform:translateY(-50%);background:rgba(11,57,133,.8);color:#fff;font-size:13px;line-height:1;padding:9px 12px;border-radius:20px;z-index:6;pointer-events:none;animation:nudge 1.2s ease-in-out 3;transition:opacity .4s}
  @keyframes nudge{50%{transform:translate(-8px,-50%)}}
  .hint.hide{opacity:0}
  @media(hover:hover) and (pointer:fine){.hint{display:none}}
  /* 하단 메뉴 */
  nav{position:relative;flex:none;line-height:0;background:#0b3985;padding-bottom:env(safe-area-inset-bottom)}
  nav img{width:100%;height:auto;display:block}
  nav .tabs{position:absolute;inset:0 0 env(safe-area-inset-bottom) 0;display:flex}
  nav .tabs a{flex:1;position:relative;-webkit-tap-highlight-color:transparent}
  nav .tabs a.on::after{content:"";position:absolute;left:22%;right:22%;bottom:6%;height:4px;border-radius:2px;background:#0090da}
  nav .tabs a:active{background:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="app">
  <div class="slider" id="slider">
    <section class="page p1" id="home"><div class="inner"><div class="art">
      <img src="img/sec1.jpg" width="1200" height="1972" alt="2026 더 깊고 넓은 역량중심 교육과정 운영을 위한 AI·디지털 교육 컨퍼런스. 일시 2026년 11월 23일(월) 15:00~18:00, 장소 L7 광명 바이 롯데호텔 별관 4층">
    </div></div></section>
    <section class="page p2" id="schedule"><div class="inner"><div class="art">
      <img src="img/sec2.jpg" width="1200" height="1924" alt="초대의 글과 일정안내">
    </div></div></section>
    <section class="page p3" id="program"><div class="inner"><div class="art">
      <img src="img/sec3.jpg" width="1200" height="1924" alt="Page &amp; Rhythm 공감 콘서트 프로그램, 운영자료와 설문 링크">
      <span class="anchor" id="materials" style="top:58%"></span>
      <span class="anchor" id="survey" style="top:85%"></span>
      <a class="hot" href="https://m.site.naver.com/2kIKh" target="_blank" rel="noopener" style="left:24.16%;top:68.00%;width:20.91%;height:12.49%" aria-label="학교 사례 모음"></a><a class="hot" href="https://m.site.naver.com/2kN09" target="_blank" rel="noopener" style="left:54.87%;top:68.00%;width:21.04%;height:12.49%" aria-label="원고 및 발제문"></a><a class="hot" href="https://m.site.naver.com/2kIIy" target="_blank" rel="noopener" style="left:15.18%;top:86.09%;width:14.98%;height:10.98%" aria-label="사전질문"></a><a class="hot" href="https://m.site.naver.com/2kII1" target="_blank" rel="noopener" style="left:42.58%;top:86.09%;width:14.91%;height:10.98%" aria-label="만족도설문"></a><a class="hot" href="https://m.site.naver.com/2kJ4w" target="_blank" rel="noopener" style="left:69.84%;top:86.09%;width:14.91%;height:10.98%" aria-label="자리배치도"></a>
    </div></div></section>
    <section class="page p4" id="map"><div class="inner"><div class="art">
      <img src="img/sec4.jpg" width="1200" height="1924" alt="오시는 길: L7 광명 바이 롯데호텔 별관 4층 그랜드볼룸"><a class="hot" href="https://map.naver.com/p/search/L7%20%EA%B4%91%EB%AA%85%20%EB%B0%94%EC%9D%B4%20%EB%A1%AF%EB%8D%B0%ED%98%B8%ED%85%94" target="_blank" rel="noopener" style="left:8.84%;top:81.14%;width:39.82%;height:5.72%" aria-label="네이버 지도에서 보기"></a><a class="hot" href="https://map.kakao.com/link/search/L7%EA%B4%91%EB%AA%85%EB%B0%94%EC%9D%B4%EB%A1%AF%EB%8D%B0%ED%98%B8%ED%85%94" target="_blank" rel="noopener" style="left:51.42%;top:81.14%;width:39.69%;height:5.72%" aria-label="카카오맵에서 보기"></a>
    </div></div></section>
  </div>

  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <button class="arrow prev" id="prev" aria-label="이전 페이지">‹</button>
  <button class="arrow next" id="next" aria-label="다음 페이지">›</button>
  <div class="hint" id="hint">옆으로 넘겨보세요 ›</div>

  <nav id="nav">
    <img src="img/nav.jpg" width="1200" height="176" alt="">
    <div class="tabs">
      <a href="#home" data-p="0" aria-label="홈"></a>
      <a href="#schedule" data-p="1" aria-label="일정안내"></a>
      <a href="#materials" data-p="2" data-a="materials" aria-label="운영자료"></a>
      <a href="#survey" data-p="2" data-a="survey" aria-label="사전질문&amp;설문"></a>
      <a href="#map" data-p="3" aria-label="오시는 길"></a>
    </div>
  </nav>
</div>

<script>
(function(){
  const app=document.querySelector('.app'), slider=document.getElementById('slider');
  const pages=[...slider.children], dots=[...document.querySelectorAll('#dots i')];
  const tabs=[...document.querySelectorAll('nav .tabs a')];
  const prev=document.getElementById('prev'), next=document.getElementById('next'), hint=document.getElementById('hint');
  const nav=document.getElementById('nav');
  let cur=0, p3tab=2;

  function setNavH(){ app.style.setProperty('--navh', nav.offsetHeight+'px'); }
  function idx(){ return Math.round(slider.scrollLeft/slider.clientWidth); }
  function go(i,smooth=true){
    i=Math.max(0,Math.min(pages.length-1,i));
    slider.scrollTo({left:i*slider.clientWidth,behavior:smooth?'smooth':'auto'});
  }
  function update(){
    cur=idx();
    dots.forEach((d,i)=>d.classList.toggle('on',i===cur));
    prev.disabled=cur===0; next.disabled=cur===pages.length-1;
    let t=[0,1,2,4][cur];
    if(cur===2){
      const p=pages[2], s=document.getElementById('survey');
      const top=s.getBoundingClientRect().top-p.getBoundingClientRect().top;
      const atBottom=p.scrollTop+p.clientHeight>=p.scrollHeight-2;
      if(p.scrollHeight<=p.clientHeight+2) t=p3tab;
      else t = top<p.clientHeight*0.35 ? 3 : (atBottom ? p3tab : 2);
    }
    tabs.forEach((a,i)=>a.classList.toggle('on',i===t));
    if(cur>0) hint.classList.add('hide');
  }
  // 메뉴: 해당 페이지로 넘기고, 같은 페이지 안 위치(운영자료/설문)로 이동
  tabs.forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();
    const p=+a.dataset.p; if(p===2) p3tab=tabs.indexOf(a); go(p);
    const page=pages[p];
    if(a.dataset.a){
      const el=document.getElementById(a.dataset.a);
      const y=page.scrollTop+el.getBoundingClientRect().top-page.getBoundingClientRect().top;
      page.scrollTo({top:y-page.clientHeight*0.25,behavior:'smooth'});
    } else page.scrollTo({top:0,behavior:'smooth'});
    history.replaceState(null,'',a.getAttribute('href'));
    update(); setTimeout(update,700);
  }));
  prev.onclick=()=>go(cur-1); next.onclick=()=>go(cur+1);
  addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
  slider.addEventListener('scroll',update,{passive:true});
  pages.forEach(p=>p.addEventListener('scroll',update,{passive:true}));
  addEventListener('resize',()=>{ setNavH(); go(cur,false); });
  setTimeout(()=>hint.classList.add('hide'),4500);
  // 주소 뒤 #map 같은 표시로 바로 열기
  window.addEventListener('load',()=>{
    setNavH();
    const h=location.hash.slice(1), a=tabs.find(t=>t.getAttribute('href')==='#'+h);
    if(a) a.click(); update();
  });
  setNavH(); update();
})();
</script>
</body>
</html>
