<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;background:#e9f3fb}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:480px;margin:0 auto;background:#fff;padding-bottom:calc(14.67vw + env(safe-area-inset-bottom));box-shadow:0 0 24px rgba(11,57,133,.12)}
  @media(min-width:480px){.wrap{padding-bottom:calc(70px + env(safe-area-inset-bottom))}}
  section{position:relative;line-height:0}
  section img{width:100%;height:auto;display:block}
  .anchor{position:absolute;left:0;width:1px;height:1px}
  .hot{position:absolute;display:block;border-radius:12px;-webkit-tap-highlight-color:transparent}
  .hot:active{background:rgba(0,120,215,.18)}
  @media(hover:hover){.hot:hover{background:rgba(0,120,215,.10);outline:2px solid rgba(0,120,215,.35)}}
  nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:10;line-height:0;background:#0b3985;padding-bottom:env(safe-area-inset-bottom)}
  nav img{width:100%;height:auto;display:block}
  nav .tabs{position:absolute;inset:0 0 env(safe-area-inset-bottom) 0;display:flex}
  nav .tabs a{flex:1;position:relative;-webkit-tap-highlight-color:transparent}
  nav .tabs a.on::after{content:"";position:absolute;left:22%;right:22%;bottom:6%;height:4px;border-radius:2px;background:#0090da}
  nav .tabs a:active{background:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="wrap">
  <section id="home"><img src="img/sec1.jpg" width="1200" height="1979" alt="2026 더 깊고 넓은 역량중심 교육과정 운영을 위한 AI·디지털 교육 컨퍼런스. 일시 2026년 11월 23일(월) 15:00~18:00, 장소 L7 광명 바이 롯데호텔 별관 4층"></section>
  <section id="schedule"><img src="img/sec2.jpg" width="1200" height="1924" alt="초대의 글과 일정안내" loading="lazy"></section>
  <section id="program"><img src="img/sec3.jpg" width="1200" height="1924" alt="Page &amp; Rhythm 공감 콘서트 프로그램, 운영자료와 설문 링크" loading="lazy">
    <span class="anchor" id="materials" style="top:58%"></span>
    <span class="anchor" id="survey" style="top:85%"></span>
    <a class="hot" href="https://m.site.naver.com/2kIKh" target="_blank" rel="noopener" style="left:24.16%;top:68.00%;width:20.91%;height:12.49%" aria-label="학교 사례 모음"></a><a class="hot" href="https://m.site.naver.com/2kN09" target="_blank" rel="noopener" style="left:54.87%;top:68.00%;width:21.04%;height:12.49%" aria-label="원고 및 발제문"></a><a class="hot" href="https://m.site.naver.com/2kIIy" target="_blank" rel="noopener" style="left:15.18%;top:86.09%;width:14.98%;height:10.98%" aria-label="사전질문"></a><a class="hot" href="https://m.site.naver.com/2kII1" target="_blank" rel="noopener" style="left:42.58%;top:86.09%;width:14.91%;height:10.98%" aria-label="만족도설문"></a><a class="hot" href="https://m.site.naver.com/2kJ4w" target="_blank" rel="noopener" style="left:69.84%;top:86.09%;width:14.91%;height:10.98%" aria-label="자리배치도"></a>
  </section>
  <section id="map"><img src="img/sec4.jpg" width="1200" height="1924" alt="오시는 길: L7 광명 바이 롯데호텔 별관 4층 그랜드볼룸" loading="lazy"><a class="hot" href="https://map.naver.com/p/search/L7%20%EA%B4%91%EB%AA%85%20%EB%B0%94%EC%9D%B4%20%EB%A1%AF%EB%8D%B0%ED%98%B8%ED%85%94" target="_blank" rel="noopener" style="left:8.84%;top:81.14%;width:39.82%;height:5.72%" aria-label="네이버 지도에서 보기"></a><a class="hot" href="https://map.kakao.com/link/search/L7%EA%B4%91%EB%AA%85%EB%B0%94%EC%9D%B4%EB%A1%AF%EB%8D%B0%ED%98%B8%ED%85%94" target="_blank" rel="noopener" style="left:51.42%;top:81.14%;width:39.69%;height:5.72%" aria-label="카카오맵에서 보기"></a></section>
</div>

<nav>
  <img src="img/nav.jpg" width="1200" height="176" alt="">
  <div class="tabs">
    <a href="#home" data-t="home" aria-label="홈"></a>
    <a href="#schedule" data-t="schedule" aria-label="일정안내"></a>
    <a href="#materials" data-t="materials" aria-label="운영자료"></a>
    <a href="#survey" data-t="survey" aria-label="사전질문&amp;설문"></a>
    <a href="#map" data-t="map" aria-label="오시는 길"></a>
  </div>
</nav>

<script>
  // 현재 보고 있는 구역에 맞춰 하단 메뉴 표시
  const tabs=[...document.querySelectorAll('nav .tabs a')];
  const pts=['home','schedule','materials','survey','map'].map(id=>document.getElementById(id));
  function mark(){
    const y=window.innerHeight*0.4; let cur=0;
    pts.forEach((el,i)=>{ if(el.getBoundingClientRect().top<=y) cur=i; });
    if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4) cur=4;
    tabs.forEach((t,i)=>t.classList.toggle('on',i===cur));
  }
  addEventListener('scroll',mark,{passive:true}); addEventListener('resize',mark); mark();
</script>
</body>
</html>
